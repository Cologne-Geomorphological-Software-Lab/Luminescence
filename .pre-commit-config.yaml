# Pre-commit hooks for the Python port. Local hooks via `uv run` so the hook
# versions always match the locked project toolchain (ruff, basedpyright).
# The R sources are untouched: every hook is restricted to Python files.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python]
        require_serial: true

      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        types_or: [python]
        pass_filenames: false
